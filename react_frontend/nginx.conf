server {
    # Nginx web server port
    # Docker Compose mein host port 80 → container port 80 mapped hai
    listen 80;

    # Accept requests for any hostname
    server_name _;

    # React production build files
    root /usr/share/nginx/html;
    index index.html;

    # Maximum size of a request body/upload allowed by Nginx.
    # This is useful for RAG document uploads such as PDFs.
    # Example: a user can upload a file up to 50 MB.
    client_max_body_size 50m;


    # =========================================================
    # FastAPI Backend
    # =========================================================
    # Requests like:
    #   /api/documents/upload
    #   /api/search
    #   /api/chat
    #
    # are forwarded from Nginx to the FastAPI container.
    location /api/ {

        # "api" is the Docker Compose service name.
        # Port 8000 is the FastAPI port INSIDE the Docker network.
        proxy_pass http://api:8000/;

        # Preserve the original request hostname.
        proxy_set_header Host $host;

        # Pass the real client IP to FastAPI.
        proxy_set_header X-Real-IP $remote_addr;

        # Preserve the proxy chain/client IP information.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tell FastAPI whether the original request used HTTP/HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # =========================================================
    # React Frontend
    # =========================================================
    # Everything that is not /api/ is treated as a React request.
    location / {
        # First look for an actual file/directory.
        # If it doesn't exist, send the request to index.html.
        #
        # This is important for React Router routes such as:
        # /dashboard
        # /login
        # /profile
        try_files $uri $uri/ /index.html;
    }
}